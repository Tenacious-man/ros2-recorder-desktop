name: Build and publish deb

on:
  push:
    branches: [main]
    paths: [ros2_recorder/__init__.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify the package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'from ros2_recorder import __version__; print(__version__)')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 make_deb.py --version "${version}-1"
          package="artifacts/ros2-recorder-desktop_${version}-1_all.deb"
          test "$(dpkg-deb -f "$package" Version)" = "${version}-1"
          test "$(dpkg-deb -f "$package" Architecture)" = all
          (cd artifacts && sha256sum -c "ros2-recorder-desktop_${version}-1_all.deb.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "artifacts/ros2-recorder-desktop_${VERSION}-1_all.deb" \
            "artifacts/ros2-recorder-desktop_${VERSION}-1_all.deb.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ROS Recorder v${VERSION}" --notes-file docs/release-notes.md --draft
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
